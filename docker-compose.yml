services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads, hfcache:/hf-cache, ./experiments:/srv/experiments]

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [uploads:/data/uploads, hfcache:/hf-cache]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  pgdata:
  uploads:
  hfcache:
  ollama:
